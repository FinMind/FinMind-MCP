name: Publish to PyPI

# 推一個新的版本 tag（vX.Y.Z）就自動 build + 上傳 PyPI（也可手動 workflow_dispatch）。
# 用 PyPI Trusted Publishing（OIDC）—— 不需要存任何 API token / secret。
#
# 一次性設定（使用者在 PyPI 端做，我做不了）：
#   1. https://pypi.org/manage/account/publishing/ → Add a new pending publisher
#        PyPI Project Name: finmind-mcp
#        Owner:             FinMind
#        Repository name:   FinMind-MCP
#        Workflow name:     publish.yml
#        Environment name:  pypi
#      （專案還沒上 PyPI 沒關係，用 "pending publisher"，第一次發版會自動建立專案）
#   2. GitHub repo → Settings → Environments → 新增名為 `pypi` 的 environment
#      （名稱要跟上面 PyPI 設定一致；可另設保護規則，例如限定 reviewer 才能發版）
#
# 發版流程（tag 驅動，版本號 = tag，不用改 pyproject.toml）：
#   - git tag v0.1.0
#   - git push origin v0.1.0   ← 推 tag 就觸發；hatch-vcs 從 tag 算出版本 0.1.0
#                                 自動 build → 上傳 PyPI（PyPI 版本號不可重複，所以每次用新 tag）
#   - 上 PyPI 之後，mcpb job 會打包 Claude Desktop 擴充套件 finmind.mcpb（釘同版本），
#     附加到該 tag 的 GitHub Release。下載連結固定為
#     https://github.com/FinMind/FinMind-MCP/releases/latest/download/finmind.mcpb

on:
  push:
    tags:
      - "v[0-9]*"   # vX.Y.Z
      - "[0-9]*"    # 也接受沒有 v 前綴的 X.Y.Z
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hatch-vcs 需要完整 history + tags 才能從 tag 算版本

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel (version derived from the pushed tag)
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/finmind-mcp/
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — no password needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  mcpb:
    # 必須在 PyPI 發佈之後：.mcpb 裡的 pyproject 釘 finmind-mcp==<tag>，
    # 使用者安裝時由 Claude Desktop 用 uv 從 PyPI 下載。
    needs: pypi-publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建立 / 更新 GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build finmind.mcpb (pinned to this tag)
        run: python3 scripts/build_mcpb.py "$GITHUB_REF_NAME"

      - name: Install & launch like Claude Desktop (from PyPI)
        # PyPI 剛發佈時 index 可能還沒更新，失敗就等一下重試。
        # 必須關掉 uv cache：否則第一次查到「沒有這個版本」的 index 會被快取，
        # 之後每次重試都讀到同一份舊結果（0.0.11 發版時 5 次重試全失敗）。
        env:
          UV_NO_CACHE: "1"
        run: |
          for i in 1 2 3 4 5; do
            python3 scripts/check_mcpb.py && exit 0
            echo "retry $i: waiting for PyPI index"; sleep 60
          done
          exit 1

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/finmind.mcpb --clobber
