[project]
name = "finmind-mcp"
version = "0.1.0"
description = "FinMind MCP server — Taiwan / global financial data for Claude, Gemini CLI, Cursor, Windsurf, and other MCP hosts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "FinMind", email = "finmind.tw@gmail.com" }]
keywords = ["mcp", "finmind", "finance", "taiwan-stock", "claude", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/FinMind/FinMind-MCP"
Repository = "https://github.com/FinMind/FinMind-MCP"
"Bug Tracker" = "https://github.com/FinMind/FinMind-MCP/issues"
"FinMind API" = "https://finmindtrade.com"

[project.scripts]
finmind-mcp = "finmind_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finmind_mcp"]

# 把 knowledge/ markdown 塞進 wheel 的 finmind_mcp/_knowledge/，這樣 pip install
# 後 server runtime 還能讀到 dataset / errors / instructions。dev / editable
# install 時還是讀 repo root 的 knowledge/（見 finmind_mcp/knowledge.py）。
[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "finmind_mcp/_knowledge"

[tool.hatch.build.targets.sdist]
include = [
    "src/finmind_mcp",
    "knowledge",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
