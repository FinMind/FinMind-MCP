[project]
name = "finmind-mcp"
dynamic = ["version"]   # 版本由 git tag 決定（hatch-vcs），發版只要推 tag，不用改這裡
description = "FinMind MCP server — Taiwan / global financial data for Claude, Gemini CLI, Cursor, Windsurf, and other MCP hosts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "FinMind", email = "finmind.tw@gmail.com" }]
keywords = ["mcp", "finmind", "finance", "taiwan-stock", "claude", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    # download_financial_report 抽財報 PDF 文字（純 Python，約 300 KB）。
    # 下限設在已修正已知「特製 PDF 造成無窮迴圈／記憶體暴增」漏洞的版本：PDF 由各公司上傳，
    # 不能假設內容可信。
    "pypdf>=6.21.4",
]

[project.urls]
Homepage = "https://github.com/FinMind/FinMind-MCP"
Repository = "https://github.com/FinMind/FinMind-MCP"
"Bug Tracker" = "https://github.com/FinMind/FinMind-MCP/issues"
"FinMind API" = "https://finmindtrade.com"

[project.scripts]
finmind-mcp = "finmind_mcp.server:main"

[project.optional-dependencies]
# download_storage_object 讀整日 parquet 用（算筆數、欄位、head、依 data_id 過濾）。
# pyarrow wheel 約 29–54 MB（依平台），不放必裝相依；沒裝時工具仍會下載檔案、
# 回傳路徑，並提示安裝方式。Claude Desktop 擴充套件（mcpb/）預設帶這個 extra。
# 14.0.1 起修正讀 parquet 時的反序列化漏洞（CVE-2023-47248），14.0.0 以前不可用。
parquet = ["pyarrow>=14.0.1"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21", "pyarrow>=14.0.1"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# 版本來源 = git tag（透過 hatch-vcs / setuptools-scm）。
# 推 tag vX.Y.Z → build 出來就是 X.Y.Z；非 tag commit 會是 dev 版號。
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/finmind_mcp"]

# 把 knowledge/ markdown 塞進 wheel 的 finmind_mcp/_knowledge/，這樣 pip install
# 後 server runtime 還能讀到 dataset / errors / instructions。dev / editable
# install 時還是讀 repo root 的 knowledge/（見 finmind_mcp/knowledge.py）。
[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "finmind_mcp/_knowledge"

[tool.hatch.build.targets.sdist]
include = [
    "src/finmind_mcp",
    "knowledge",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
